<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset memory bank — gallery</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080b0f;
        --panel: #0d1218;
        --raised: #121a23;
        --line: #1d2733;
        --text: #e6edf5;
        --muted: #7f8ea3;
        --accent: #4cc2ff;
        --accent-soft: rgba(76, 194, 255, 0.14);
        --good: #6ee7b7;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; color: inherit; }

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 14px 22px;
        background: rgba(8, 11, 15, 0.92);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .brand { display: flex; flex-direction: column; gap: 2px; }
      .brand h1 { margin: 0; font-size: 15px; letter-spacing: 0.01em; }
      .brand span { color: var(--muted); font-size: 12px; }
      .search {
        flex: 1 1 260px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .search input {
        flex: 1;
        min-width: 0;
        background: none;
        border: 0;
        outline: none;
        color: var(--text);
        font: inherit;
      }
      .search input::placeholder { color: var(--muted); }
      .search kbd {
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 6px;
        font-size: 11px;
      }
      .toolbar { display: flex; align-items: center; gap: 10px; margin-left: auto; }
      select {
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        font: inherit;
        outline: none;
      }

      .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 0; }
      aside {
        position: sticky;
        top: 65px;
        align-self: start;
        height: calc(100vh - 65px);
        overflow-y: auto;
        padding: 16px 12px 40px;
        border-right: 1px solid var(--line);
      }
      .aside-title {
        margin: 0 8px 8px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .cat {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 7px 9px;
        margin-bottom: 2px;
        background: none;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        color: var(--text);
      }
      .cat:hover { background: var(--raised); }
      .cat[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent); }
      .cat b { font-weight: 600; font-size: 12.5px; }
      .cat i { color: var(--muted); font-style: normal; font-size: 11px; }
      .cat[aria-pressed='true'] i { color: var(--accent); }

      main { padding: 18px 22px 60px; min-width: 0; }
      .subrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .chip {
        padding: 5px 11px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        font-size: 12.5px;
        color: var(--muted);
      }
      .chip:hover { color: var(--text); }
      .chip[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: rgba(76, 194, 255, 0.4);
        color: var(--accent);
      }
      .status { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
      .status b { color: var(--text); font-size: 13px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
        gap: 14px;
      }
      .card {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover { border-color: rgba(76, 194, 255, 0.45); transform: translateY(-2px); }
      .shot {
        position: relative;
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        background:
          radial-gradient(120% 120% at 50% 0%, #17202b 0%, #0a0e14 70%);
        overflow: hidden;
      }
      .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .shot .fallback { color: var(--muted); font-size: 26px; font-weight: 600; letter-spacing: 0.05em; }
      .shot .badge {
        position: absolute;
        left: 8px;
        bottom: 8px;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgba(6, 10, 14, 0.78);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .card-body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; }
      .card-body strong {
        font-size: 12.8px;
        font-weight: 600;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card-body small { color: var(--muted); font-size: 11.5px; }
      .empty { padding: 60px 0; text-align: center; color: var(--muted); }

      .drawer {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 480px);
        background: rgba(3, 6, 9, 0.62);
        backdrop-filter: blur(3px);
      }
      .drawer[hidden] { display: none; }
      .drawer .scrim { cursor: zoom-out; }
      .sheet {
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 20px 20px 40px;
      }
      .sheet-head { display: flex; gap: 12px; align-items: flex-start; }
      .sheet-head h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.25; }
      .sheet-head p { margin: 0; color: var(--muted); font-size: 12px; }
      .close {
        margin-left: auto;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
      }
      .hero {
        margin: 16px 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #0a0e14;
      }
      .hero img { width: 100%; display: block; }
      .facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0 0 18px; font-size: 12.5px; }
      .facts dt { color: var(--muted); }
      .facts dd { margin: 0; word-break: break-word; }
      .facts a { color: var(--accent); }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
      .tags span {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
      .files li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 12px;
      }
      .files a { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .files a:hover { color: var(--accent); }
      .files em { color: var(--muted); font-style: normal; flex: 0 0 auto; font-size: 11px; }
      .files button {
        flex: 0 0 auto;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        padding: 2px 7px;
      }
      .files button:hover { color: var(--accent); border-color: rgba(76, 194, 255, 0.4); }
      .clips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
      .clips span {
        padding: 3px 9px;
        border-radius: 999px;
        background: rgba(110, 231, 183, 0.1);
        color: var(--good);
        font-size: 11.5px;
      }
      .note { color: var(--muted); font-size: 11.5px; margin: 14px 0 0; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 8px 14px;
        background: #101a22;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
        z-index: 60;
      }
      .toast[data-show='true'] { opacity: 1; }

      @media (max-width: 860px) {
        .layout { grid-template-columns: minmax(0, 1fr); }
        aside {
          position: static;
          height: auto;
          display: flex;
          gap: 6px;
          overflow-x: auto;
          padding: 10px 14px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .aside-title { display: none; }
        .cat { width: auto; white-space: nowrap; gap: 6px; }
        .drawer { grid-template-columns: minmax(0, 1fr); }
        .sheet { border-left: 0; }
        .drawer .scrim { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Asset memory bank</h1>
        <span id="totals">loading index…</span>
      </div>
      <label class="search">
        <input id="q" type="search" placeholder="Search models, materials, sounds…" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div class="toolbar">
        <select id="sort" aria-label="Sort">
          <option value="category">Category, then name</option>
          <option value="name">Name</option>
          <option value="size">Largest first</option>
          <option value="tris">Most triangles</option>
        </select>
      </div>
    </header>

    <div class="layout">
      <aside>
        <p class="aside-title">Categories</p>
        <div id="cats"></div>
      </aside>
      <main>
        <div class="subrow" id="subs"></div>
        <p class="status" id="status"></p>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
      </main>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Asset details"></div>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <script type="module">
      const state = { q: '', category: 'all', sub: '', sort: 'category' };
      const el = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const mb = (bytes) => (bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`);
      const pretty = (name) => name.replace(/^0\d_/, '').replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());

      let data = { assets: [], counts: {}, totals: {} };
      let visible = [];

      const toast = (message) => {
        const node = el('toast');
        node.textContent = message;
        node.dataset.show = 'true';
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (node.dataset.show = 'false'), 1500);
      };

      async function load() {
        const res = await fetch('./assets.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        data = await res.json();
        el('totals').textContent = `${data.totals.assets} assets · ${data.totals.files.toLocaleString()} files · ${mb(
          data.totals.bytes,
        )} · ${data.totals.clips} animation clips · all CC0`;
        renderCategories();
        render();
      }

      function renderCategories() {
        const total = data.assets.length;
        const rows = [['all', 'All categories', total]]
          .concat(Object.entries(data.counts).sort((a, b) => a[0].localeCompare(b[0])))
          .map(
            ([key, count]) => `<button class="cat" data-cat="${esc(key)}" aria-pressed="${
              state.category === key
            }"><b>${key === 'all' ? 'All' : esc(pretty(key))}</b><i>${count}</i></button>`,
          );
        el('cats').innerHTML = rows.join('');
        el('cats').querySelectorAll('.cat').forEach((btn) =>
          btn.addEventListener('click', () => {
            state.category = btn.dataset.cat;
            state.sub = '';
            renderCategories();
            render();
          }),
        );
      }

      function renderSubs() {
        if (state.category === 'all') {
          el('subs').innerHTML = '';
          return;
        }
        const subs = new Map();
        for (const a of data.assets) {
          if (a.category !== state.category) continue;
          const key = a.subcategory || 'Unfiled';
          subs.set(key, (subs.get(key) || 0) + 1);
        }
        const chips = [['', 'All', [...subs.values()].reduce((n, v) => n + v, 0)]].concat(
          [...subs.entries()].sort((a, b) => a[0].localeCompare(b[0])),
        );
        el('subs').innerHTML = chips
          .map(
            ([key, label, count]) =>
              `<button class="chip" data-sub="${esc(key)}" aria-pressed="${state.sub === key}">${esc(label)} <i>${count}</i></button>`,
          )
          .join('');
        el('subs').querySelectorAll('.chip').forEach((btn) =>
          btn.addEventListener('click', () => {
            state.sub = btn.dataset.sub;
            renderSubs();
            render();
          }),
        );
      }

      function matches(asset) {
        if (state.category !== 'all' && asset.category !== state.category) return false;
        if (state.sub && (asset.subcategory || 'Unfiled') !== state.sub) return false;
        if (!state.q) return true;
        const hay = [asset.name, asset.subcategory, asset.source, asset.creator, ...(asset.tags || []), ...(asset.formats || [])]
          .join(' ')
          .toLowerCase();
        return state.q.split(/\s+/).every((word) => hay.includes(word));
      }

      function sorted(list) {
        const by = {
          category: (a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name),
          name: (a, b) => a.name.localeCompare(b.name),
          size: (a, b) => b.bytes - a.bytes,
          tris: (a, b) => (b.triangles || 0) - (a.triangles || 0),
        }[state.sort];
        return [...list].sort(by);
      }

      function card(asset) {
        const shot = asset.thumb
          ? `<img src="${esc(asset.thumb)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'${esc(
              asset.kind.slice(0, 3).toUpperCase(),
            )}'}))" />`
          : `<div class="fallback">${esc(asset.kind.slice(0, 3).toUpperCase())}</div>`;
        const label = (asset.formats || []).join(' · ') || asset.kind;
        const meta = [
          asset.triangles ? `${asset.triangles.toLocaleString()} tris` : '',
          asset.files.length > 1 ? `${asset.files.length} files` : '',
          mb(asset.bytes),
        ]
          .filter(Boolean)
          .join(' · ');
        return `<button class="card" data-id="${esc(asset.id)}">
          <div class="shot">${shot}<span class="badge">${esc(label)}</span></div>
          <div class="card-body"><strong>${esc(asset.name)}</strong><small>${esc(
            asset.subcategory || pretty(asset.category),
          )} · ${esc(meta)}</small></div>
        </button>`;
      }

      function render() {
        renderSubs();
        visible = sorted(data.assets.filter(matches));
        el('grid').innerHTML = visible.map(card).join('');
        el('empty').hidden = visible.length > 0;
        el('status').innerHTML = `<b>${visible.length}</b> asset${visible.length === 1 ? '' : 's'}${
          state.category === 'all' ? '' : ` in ${esc(pretty(state.category))}`
        }${state.q ? ` matching “${esc(state.q)}”` : ''}`;
        el('grid').querySelectorAll('.card').forEach((node) =>
          node.addEventListener('click', () => open(node.dataset.id)),
        );
      }

      function fileRow(file) {
        const size = file.width && file.height ? `${file.width}×${file.height}` : mb(file.bytes);
        return `<li><a href="${esc(file.url)}" target="_blank" rel="noreferrer">${esc(
          file.path.split('/').slice(-2).join('/'),
        )}</a><em>${esc(file.format)} · ${esc(size)}</em><button data-copy="${esc(
          file.url,
        )}" title="Copy bank path">copy</button></li>`;
      }

      function open(id) {
        const asset = data.assets.find((a) => a.id === id);
        if (!asset) return;
        const facts = [
          ['Category', `${pretty(asset.category)}${asset.subcategory ? ` / ${esc(asset.subcategory)}` : ''}`],
          ['Creator', esc(asset.creator)],
          ['Source', `<a href="${esc(asset.page)}" target="_blank" rel="noreferrer">${esc(asset.source)} page</a>`],
          ['Licence', esc(asset.license)],
          ['Format', esc((asset.formats || []).join(', ') || asset.kind)],
          ['Size', mb(asset.bytes)],
          asset.triangles ? ['Triangles', asset.triangles.toLocaleString()] : null,
          asset.textures ? ['Textures', String(asset.textures)] : null,
          asset.resolution ? ['Resolution', esc(asset.resolution)] : null,
          ['Files', String(asset.files.length)],
        ].filter(Boolean);

        el('sheet').innerHTML = `
          <div class="sheet-head">
            <div>
              <h2>${esc(asset.name)}</h2>
              <p>${esc(asset.creator)} · ${esc(asset.license)}</p>
            </div>
            <button class="close" id="close" aria-label="Close">✕</button>
          </div>
          ${asset.thumb ? `<div class="hero"><img src="${esc(asset.thumb)}" alt="${esc(asset.name)}" /></div>` : ''}
          ${asset.summary ? `<p class="note">${esc(asset.summary)}</p>` : ''}
          <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
          ${asset.tags.length ? `<div class="tags">${asset.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
          ${
            asset.animations.length
              ? `<h3>Animation clips (${asset.animations.length})</h3><div class="clips">${asset.animations
                  .map((c) => `<span>${esc(c)}</span>`)
                  .join('')}</div>`
              : ''
          }
          <h3>Files</h3>
          <ul class="files">${asset.files.map(fileRow).join('')}</ul>
          <p class="note">Paths are relative to <code>ASSET_MEMORY_BANK/</code>, the same paths the catalogue uses.</p>`;

        el('drawer').hidden = false;
        el('close').addEventListener('click', close);
        el('sheet').querySelectorAll('[data-copy]').forEach((btn) =>
          btn.addEventListener('click', async () => {
            const url = btn.dataset.copy;
            const bankPath = decodeURIComponent(url.replace(/^\.\.\/ASSET_MEMORY_BANK\//, ''));
            try {
              await navigator.clipboard.writeText(`ASSET_MEMORY_BANK/${bankPath}`);
              btn.textContent = 'copied';
              setTimeout(() => (btn.textContent = 'copy'), 1200);
            } catch {
              toast(`ASSET_MEMORY_BANK/${bankPath}`);
            }
          }),
        );
        el('sheet').scrollTop = 0;
      }

      function close() {
        el('drawer').hidden = true;
      }

      el('q').addEventListener('input', (event) => {
        state.q = event.target.value.trim().toLowerCase();
        render();
      });
      el('sort').addEventListener('change', (event) => {
        state.sort = event.target.value;
        render();
      });
      el('scrim').addEventListener('click', close);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') close();
        if (event.key === '/' && document.activeElement !== el('q')) {
          event.preventDefault();
          el('q').focus();
        }
      });

      load().catch((error) => {
        el('status').textContent = `Could not load the gallery index: ${error.message}. Run node tools/asset-bank/build-gallery.mjs.`;
      });
    </script>
  </body>
</html>
